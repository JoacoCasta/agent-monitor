name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Universal AgentMonitor.app, DMG, and ZIP
        run: |
          mkdir -p dist/release-mac/AgentMonitor.app/Contents/MacOS dist/release-mac/AgentMonitor.app/Contents/Resources/Scripts
          swiftc -swift-version 5 -O -target arm64-apple-macosx14.0 -framework AppKit -framework SwiftUI -framework UserNotifications -framework Combine Sources/*.swift -o dist/AgentMonitor-arm64
          swiftc -swift-version 5 -O -target x86_64-apple-macosx14.0 -framework AppKit -framework SwiftUI -framework UserNotifications -framework Combine Sources/*.swift -o dist/AgentMonitor-x86_64
          lipo -create dist/AgentMonitor-arm64 dist/AgentMonitor-x86_64 -output dist/release-mac/AgentMonitor.app/Contents/MacOS/AgentMonitor
          lipo -info dist/release-mac/AgentMonitor.app/Contents/MacOS/AgentMonitor
          lipo -info dist/release-mac/AgentMonitor.app/Contents/MacOS/AgentMonitor | grep -q "arm64"
          lipo -info dist/release-mac/AgentMonitor.app/Contents/MacOS/AgentMonitor | grep -q "x86_64"
          cp Resources/Info.plist dist/release-mac/AgentMonitor.app/Contents/Info.plist
          cp Resources/AppIcon.icns dist/release-mac/AgentMonitor.app/Contents/Resources/AppIcon.icns
          cp Scripts/*.py dist/release-mac/AgentMonitor.app/Contents/Resources/Scripts/
          chmod 755 dist/release-mac/AgentMonitor.app/Contents/Resources/Scripts/*.py
          codesign --force --deep --sign - dist/release-mac/AgentMonitor.app
          codesign --verify --deep --strict dist/release-mac/AgentMonitor.app

          ditto -c -k --sequesterRsrc --keepParent dist/release-mac/AgentMonitor.app AgentMonitor-macOS.zip

          mkdir -p dist/dmg-root
          cp -R dist/release-mac/AgentMonitor.app dist/dmg-root/AgentMonitor.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "Agent Monitor" -srcfolder dist/dmg-root -ov -format UDZO AgentMonitor-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            AgentMonitor-macOS.dmg
            AgentMonitor-macOS.zip

  publish-release:
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/macos-artifacts/AgentMonitor-macOS.dmg
            artifacts/macos-artifacts/AgentMonitor-macOS.zip
