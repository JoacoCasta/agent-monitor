name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: |
          python -m py_compile Scripts/hook-handler.py Scripts/fetch-quota.py Scripts/claude-statusline.py Scripts/configure-hooks.py desktop/i18n.py desktop/core.py desktop/agent_monitor.py tests/test_cross_platform.py

      - name: Run cross-platform unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify desktop tray dependencies and CLI status output (Linux & Windows)
        if: runner.os != 'macOS'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          python desktop/agent_monitor.py --status-json

      - name: Verify Linux PySide6 GUI import
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
          QT_QPA_PLATFORM=offscreen python -c "import PySide6.QtWidgets, desktop.agent_monitor; print('PYSIDE6_LINUX_OK')"

      - name: Verify Windows PySide6 GUI import
        if: runner.os == 'Windows'
        run: |
          python -c "import PySide6.QtWidgets, desktop.agent_monitor; print('PYSIDE6_WINDOWS_OK')"

      - name: Build macOS Swift app bundle
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/AgentMonitor.app/Contents/MacOS build/AgentMonitor.app/Contents/Resources
          swiftc -swift-version 5 -O -framework AppKit -framework SwiftUI -framework UserNotifications -framework Combine Sources/*.swift -o build/AgentMonitor.app/Contents/MacOS/AgentMonitor
          cp Resources/Info.plist build/AgentMonitor.app/Contents/Info.plist
          codesign --force --deep --sign - build/AgentMonitor.app
          codesign --verify --deep --strict build/AgentMonitor.app
