name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python helper scripts
        run: |
          python3 -m py_compile Scripts/*.py

      - name: Run macOS unit tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Validate shell scripts
        run: |
          bash -n build.sh install.sh uninstall.sh

      - name: Enforce no @State or @Observable in Sources
        run: |
          if grep -rnE '@State\b|@Observable\b' Sources/*.swift; then
            echo "Error: @State and @Observable macros are not supported by CommandLineTools swiftc builds."
            exit 1
          fi

      - name: Build Universal (arm64 + x86_64) macOS app bundle
        run: |
          mkdir -p build/AgentMonitor.app/Contents/MacOS build/AgentMonitor.app/Contents/Resources/Scripts
          swiftc -swift-version 5 -O -target arm64-apple-macosx14.0 -framework AppKit -framework SwiftUI -framework UserNotifications -framework Combine Sources/*.swift -o build/AgentMonitor-arm64
          swiftc -swift-version 5 -O -target x86_64-apple-macosx14.0 -framework AppKit -framework SwiftUI -framework UserNotifications -framework Combine Sources/*.swift -o build/AgentMonitor-x86_64
          lipo -create build/AgentMonitor-arm64 build/AgentMonitor-x86_64 -output build/AgentMonitor.app/Contents/MacOS/AgentMonitor
          lipo -info build/AgentMonitor.app/Contents/MacOS/AgentMonitor
          lipo -info build/AgentMonitor.app/Contents/MacOS/AgentMonitor | grep -q "arm64"
          lipo -info build/AgentMonitor.app/Contents/MacOS/AgentMonitor | grep -q "x86_64"
          cp Resources/Info.plist build/AgentMonitor.app/Contents/Info.plist
          cp Resources/AppIcon.icns build/AgentMonitor.app/Contents/Resources/AppIcon.icns
          cp Scripts/*.py build/AgentMonitor.app/Contents/Resources/Scripts/
          chmod 755 build/AgentMonitor.app/Contents/Resources/Scripts/*.py
          codesign --force --deep --sign - build/AgentMonitor.app
          codesign --verify --deep --strict build/AgentMonitor.app
